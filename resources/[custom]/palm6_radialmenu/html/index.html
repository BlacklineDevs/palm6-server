<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>palm6_radialmenu</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <svg id="radial-root" class="radial-root" viewBox="-230 -230 460 460">
      <defs>
        <!-- Inline SVG symbols only — no external icon font/CDN, CSP-safe/self-contained NUI. -->
        <symbol id="icon-car" viewBox="0 0 24 24">
          <path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="3" y="11" width="18" height="6" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="7.5" cy="17.5" r="1.4" fill="currentColor"/>
          <circle cx="16.5" cy="17.5" r="1.4" fill="currentColor"/>
        </symbol>

        <symbol id="icon-user" viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="3.4" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M5 19c0-3.3 3.1-5.5 7-5.5s7 2.2 7 5.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </symbol>

        <symbol id="icon-lock" viewBox="0 0 24 24">
          <rect x="5.5" y="10.5" width="13" height="9" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="12" cy="14.7" r="1.3" fill="currentColor"/>
        </symbol>

        <symbol id="icon-wrench" viewBox="0 0 24 24">
          <path d="M14.7 6.3a3.6 3.6 0 0 0-4.9 4l-6.1 6.1a1.6 1.6 0 0 0 2.3 2.3l6.1-6.1a3.6 3.6 0 0 0 4.9-4.5l-2.4 2.4-1.9-.5-.5-1.9 2.4-2.4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        </symbol>

        <symbol id="icon-emote" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="9" cy="10.5" r="1" fill="currentColor"/>
          <circle cx="15" cy="10.5" r="1" fill="currentColor"/>
          <path d="M8.5 14.2c1 1.1 2.2 1.6 3.5 1.6s2.5-.5 3.5-1.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </symbol>

        <symbol id="icon-badge" viewBox="0 0 24 24">
          <path d="M12 3l2 2.6 3.2.4-1 3.1 1.9 2.6-3 1.7-.3 3.4L12 15.6 9.2 16.8l-.3-3.4-3-1.7 1.9-2.6-1-3.1 3.2-.4L12 3z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          <circle cx="12" cy="10.3" r="1.5" fill="currentColor"/>
        </symbol>

        <symbol id="icon-grid" viewBox="0 0 24 24">
          <rect x="4" y="4" width="6.5" height="6.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <rect x="13.5" y="4" width="6.5" height="6.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <rect x="4" y="13.5" width="6.5" height="6.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/>
        </symbol>

        <symbol id="icon-back" viewBox="0 0 24 24">
          <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </symbol>

        <!-- unknown-icon fallback -->
        <symbol id="icon-dot" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3" fill="currentColor"/>
        </symbol>
      </defs>
      <g id="wedge-layer"></g>
    </svg>

    <div class="radial-hub" id="radial-hub">
      <div class="radial-hub-title" id="radial-hub-title"></div>
      <div class="radial-hub-breadcrumb" id="radial-hub-breadcrumb"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
