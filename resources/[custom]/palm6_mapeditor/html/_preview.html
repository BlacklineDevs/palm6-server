<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>propui preview (open in a normal browser)</title>
<!-- Loads the REAL style.css + app.js so this harness never drifts from
     production. Only the <body> markup is duplicated from index.html (it rarely
     changes). Open directly in Chrome: real odb photos load here because a normal
     browser has no FiveM CSP / CDN hotlink guard, so the bootstrap prefills
     window.thumbData with direct CDN URLs (bypassing the Lua thumb proxy). -->
<link rel="stylesheet" href="style.css" />
<style>
  /* standalone-only: give the page a dark ground (in FiveM the game is behind). */
  html, body { background: radial-gradient(80% 60% at 50% 0%, #0d1626, #05070d); }
</style>
</head>
<body>
    <div id="app" class="hidden" aria-hidden="true">
        <div class="scrim"></div>
        <section class="panel" role="dialog" aria-label="Prop library">

            <header class="bar">
                <div class="brand">
                    <span class="mark" aria-hidden="true"></span>
                    <span class="brand-t">PROP&nbsp;LIBRARY</span>
                    <span id="count" class="count">0</span>
                </div>
                <div class="search">
                    <svg class="s-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg>
                    <input id="search" type="text" placeholder="Search 5,295 props by name (barrier, fence, chair…)" autocomplete="off" spellcheck="false" aria-label="Search props" />
                    <button id="clear" class="clear" title="Clear" aria-label="Clear search">&times;</button>
                </div>
                <button id="help" class="help-btn" title="Controls &amp; commands (H)" aria-label="Controls and commands"><kbd>?</kbd></button>
                <button id="close" class="close" title="Close (Esc)"><kbd>ESC</kbd></button>
            </header>

            <div class="body">
                <nav id="cats" class="cats" aria-label="Categories"></nav>
                <main id="grid" class="grid" role="group" aria-label="Props"></main>
            </div>

            <footer class="foot">
                <span id="ctx" class="ctx">Select a category</span>
                <span id="thumbstat" class="stat" title="Thumbnails stream from the RAGE object database">thumbnails: 0 loaded &middot; 0 failed</span>
            </footer>

            <aside id="detail" class="detail hidden" role="dialog" aria-label="Prop details" aria-hidden="true">
                <div class="detail-head">
                    <button id="detailBack" class="detail-back" title="Back (Esc)">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/><path d="M9 12h10"/></svg>
                        <span>Back</span>
                    </button>
                    <button id="detailFav" class="detail-fav" title="Favorite (F)" aria-label="Toggle favorite">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 18.9 6.1 21l1.2-6.5L2.5 9.9l6.6-.9z"/></svg>
                    </button>
                </div>
                <div class="detail-preview" id="detailPreview"></div>
                <div class="detail-info">
                    <div class="detail-title" id="detailTitle"></div>
                    <div class="detail-subrow">
                        <span class="detail-model" id="detailModel"></span>
                        <span class="detail-chip" id="detailChip"></span>
                    </div>
                    <dl class="detail-meta" id="detailMeta"></dl>
                    <p class="detail-desc" id="detailDesc"></p>
                </div>
                <div class="detail-foot">
                    <button id="detailSpawn" class="spawn-btn" type="button">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3Z"/><path d="M4.5 7.7l7.5 4.2 7.5-4.2M12 12v8.5"/></svg>
                        <span id="detailSpawnLabel">Spawn prop</span>
                    </button>
                </div>
            </aside>

            <div id="helpOverlay" class="help-overlay hidden" role="dialog" aria-label="Controls and commands" aria-hidden="true">
                <div class="help-head">
                    <span class="help-title">CONTROLS&nbsp;&amp;&nbsp;COMMANDS</span>
                    <span class="help-sub">in-editor keys and every slash command</span>
                    <button id="helpClose" class="close" title="Back (H)"><kbd>H</kbd></button>
                </div>
                <div id="helpBody" class="help-body"></div>
            </div>

            <div id="activityOverlay" class="help-overlay hidden" role="dialog" aria-label="Activity log" aria-hidden="true">
                <div class="help-head">
                    <span class="help-title">ACTIVITY&nbsp;LOG</span>
                    <div class="log-search">
                        <input id="logFilter" type="text" placeholder="Filter events…" autocomplete="off" spellcheck="false" aria-label="Filter activity" />
                    </div>
                    <button id="logClose" class="close" title="Back (L)"><kbd>L</kbd></button>
                </div>
                <div id="logBody" class="help-body log-body"></div>
            </div>

        </section>
    </div>

    <script src="app.js"></script>
    <script>
    /* Bootstrap the harness with real prop names + direct-CDN thumbnails. */
    (function () {
        var groups = [
            { category: 'Street & barriers', models: ['prop_barrier_work05', 'prop_barrier_work06a', 'prop_mp_barrier_02b', 'prop_roadcone02a', 'prop_worklight_03b', 'prop_barier_wire_wp', 'prop_barier_conc_01a', 'prop_barier_conc_02a'] },
            { category: 'Containers', models: ['prop_barrel_02a', 'prop_box_wood02a_mf', 'prop_crate_02a', 'prop_dumpster_01a', 'prop_bin_01a', 'prop_pallet_02a'] },
            { category: 'Interior', models: ['prop_off_chair_01', 'prop_table_03', 'prop_couch_03', 'prop_bookcase_01'] },
            { category: 'Lights', models: ['prop_streetlight_01', 'prop_lamppost_01', 'prop_wall_light_10a', 'prop_light_va_02'] },
            { category: 'Nature', models: ['prop_bush_med_01', 'prop_tree_birch_01', 'prop_plant_int_01a', 'prop_flower_01'] },
        ];
        // Prefill thumbData so requestThumb resolves from cache (no NUI host here).
        groups.forEach(function (g) {
            g.models.forEach(function (m) {
                window.thumbData[m] = 'https://cdn.rage.mp/public/odb/imgs-small/' + m.toLowerCase() + '-' + window.joaat(m) + '.jpg';
            });
        });
        try {
            localStorage.setItem('palm6_mapeditor.favs', JSON.stringify({ prop_roadcone02a: true, prop_barrel_02a: true }));
            localStorage.setItem('palm6_mapeditor.recent', JSON.stringify(['prop_worklight_03b', 'prop_dumpster_01a', 'prop_bush_med_01']));
        } catch (e) {}
        if (typeof loadPrefs === 'function') loadPrefs();
        window.postMessage({ action: 'open', groups: groups }, '*');
        // Seed the outliners + Performance panel so those rail views show data.
        window.postMessage({ action: 'scene', props: [
            { id: 1, model: 'prop_barrel_02a', x: 120.4, y: -1002.2, z: 29.4 },
            { id: 2, model: 'prop_roadcone02a', x: 121.0, y: -1003.0, z: 29.4 },
            { id: 3, model: 'prop_off_chair_01', x: 118.2, y: -1000.1, z: 29.5 },
        ], lights: [{ id: 9, kind: 'point', x: 119.0, y: -1001.0, z: 31.0, r: 255, g: 180, b: 120 }] }, '*');
        (function () {
            var liveProps = [];
            // a dense cluster (demonstrates the density warning) + a few spread out
            for (var i = 0; i < 38; i++) liveProps.push({ id: 100 + i, model: 'prop_barrel_02a', x: 200 + (i % 6), y: 300 + Math.floor(i / 6), z: 30 });
            liveProps.push({ id: 200, model: 'prop_streetlight_01', x: 800, y: -50, z: 30 });
            window.postMessage({ action: 'live', props: liveProps }, '*');
            window.postMessage({ action: 'entities', ents: [
                { id: 1, kind: 'ped', model: 's_m_y_cop_01', x: 210.0, y: 305.0, z: 30 },
                { id: 2, kind: 'ped', model: 'a_f_y_business_02', x: 215.0, y: 300.0, z: 30 },
                { id: 3, kind: 'veh', model: 'police', x: 220.0, y: 308.0, z: 30 },
                { id: 4, kind: 'veh', model: 'ambulance', x: 225.0, y: 312.0, z: 30 },
            ] }, '*');
            window.postMessage({ action: 'perf', live: { lights: 231, hides: 4, peds: 6, veh: 3 },
                caps: { liveProps: 6000, liveLights: 256, hides: 2000, entities: 1500, commit: 1000 } }, '*');
        })();
        // Preview helpers: press H for the controls sheet, L for a sample activity log.
        window.addEventListener('keydown', function (e) {
            if (e.key === 'l' || e.key === 'L') {
                var now = Math.floor(Date.now() / 1000);
                window.postMessage({ action: 'activity', log: [
                    { ts: now - 90, msg: 'spawned prop_barrel_02a', kind: 'inform' },
                    { ts: now - 60, msg: 'grid spawned 8 (3x3 @ 2.0) — one /matundo', kind: 'success' },
                    { ts: now - 20, msg: 'select a prop first (/matpick)', kind: 'error' },
                ] }, '*');
            }
        });
    })();
    </script>
</body>
</html>
