<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palm6 MDT</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: #121a28;
        --gold: #e8a54b;
        --steel: #8b9bb4;
        --line: rgba(255, 255, 255, 0.1);
        --text: #f3f5f8;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: transparent;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: var(--text);
      }
      #root {
        display: none;
        position: absolute;
        inset: 6vh 8vw;
        background: #0e1624;
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        flex-direction: column;
      }
      #root.open { display: flex; }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      header h1 {
        margin: 0;
        font-size: 14px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--gold);
      }
      button, input {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--text);
        padding: 6px 12px;
        border-radius: 6px;
      }
      button { cursor: pointer; }
      main { padding: 18px 22px; flex: 1; overflow: auto; }
      .note { color: var(--steel); font-size: 13px; line-height: 1.5; }
      .row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
      #result {
        margin-top: 16px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        font-family: ui-monospace, monospace;
        font-size: 12px;
        white-space: pre-wrap;
        min-height: 4rem;
        color: var(--steel);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <header>
        <h1>Palm6 MDT</h1>
        <button id="closeBtn" type="button">Close</button>
      </header>
      <main>
        <p class="note" id="status">Loading…</p>
        <div class="row">
          <input id="plate" type="text" maxlength="12" placeholder="Plate" />
          <button id="plateBtn" type="button">Run plate</button>
          <button id="warrantsBtn" type="button">Active warrants</button>
          <button id="bolosBtn" type="button">Active BOLOs</button>
        </div>
        <div class="row">
          <input id="warrantId" type="text" maxlength="8" placeholder="Warrant #" />
          <button id="clearWarrantBtn" type="button">Clear warrant</button>
          <input id="boloId" type="text" maxlength="8" placeholder="BOLO #" />
          <button id="clearBoloBtn" type="button">Clear BOLO</button>
        </div>
        <pre id="result">Results appear here.</pre>
      </main>
    </div>
    <script>
      const root = document.getElementById("root");
      const status = document.getElementById("status");
      const result = document.getElementById("result");
      const resource = (typeof GetParentResourceName === "function")
        ? GetParentResourceName()
        : "palm6_mdt";

      function post(name, data) {
        return fetch(`https://${resource}/${name}`, {
          method: "POST",
          headers: { "Content-Type": "application/json; charset=UTF-8" },
          body: JSON.stringify(data || {}),
        }).then((r) => r.json()).catch(() => ({ ok: false }));
      }

      window.addEventListener("message", (event) => {
        const data = event.data || {};
        if (data.action === "open") {
          root.classList.add("open");
          post("ready").then((res) => {
            if (res && res.note) status.textContent = res.note;
          });
        }
        if (data.action === "close") root.classList.remove("open");
        if (data.action === "result" && data.payload) {
          const p = data.payload;
          if (p.kind === "error") {
            result.textContent = p.message || "Error";
            return;
          }
          const lines = p.lines || [];
          result.textContent = (p.plate ? `Plate ${p.plate}\n` : "") + lines.join("\n");
        }
      });

      document.getElementById("closeBtn").addEventListener("click", () => {
        post("close");
        root.classList.remove("open");
      });
      document.getElementById("plateBtn").addEventListener("click", () => {
        const plate = document.getElementById("plate").value;
        result.textContent = "Looking up…";
        post("lookupPlate", { plate });
      });
      document.getElementById("warrantsBtn").addEventListener("click", () => {
        result.textContent = "Loading warrants…";
        post("lookupWarrants");
      });
      document.getElementById("bolosBtn").addEventListener("click", () => {
        result.textContent = "Loading BOLOs…";
        post("lookupBolos");
      });
      document.getElementById("clearWarrantBtn").addEventListener("click", () => {
        const id = document.getElementById("warrantId").value;
        result.textContent = "Clearing warrant…";
        post("clearWarrant", { id });
      });
      document.getElementById("clearBoloBtn").addEventListener("click", () => {
        const id = document.getElementById("boloId").value;
        result.textContent = "Clearing BOLO…";
        post("clearBolo", { id });
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          post("close");
          root.classList.remove("open");
        }
      });
    </script>
  </body>
</html>
