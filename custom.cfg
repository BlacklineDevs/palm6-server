# palm6_founder — renders the in-game Founding Tester tag. Reads the
# palm6_founding_grants ledger (written by the website when a verified /beta
# reservation links its Discord identity) by discord id and marks founders with
# a [FOUNDER] chat badge. The built-in badge is for the STOCK `chat` resource
