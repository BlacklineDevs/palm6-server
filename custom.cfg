# palm6_threads is DELIBERATELY NOT ENSURED. Do not add an ensure line for it.
# The Stage A spike is REPLACEMENT-style, not addon-DLC: its stream/ folder
# overwrites the BASE GAME's male-torso jbib drawable 0 (component 11, drawable 0,
# texture 0). Ensuring it would silently repaint that torso for every male
# freemode character on the server, including characters that never opted in,
# with no in-game way to tell what happened. Its own fxmanifest.lua header comment
# (the block above the stream/ listing) carries the same warning. It becomes safe
# to ensure only once Phase 1 converts it to a true addon-DLC pack with its own
# SHOP_PED_APPAREL_META_FILE.

# Dev-only cross-resource contract self-tests (evidence v2 API, staff log
# sink, export shapes). Runs ONLY when the palm6:devtest convar is 1 —
# leave that convar unset in production. Prints PASS/FAIL + summary.
# The ACE below lets the self-test console-invoke palm6_perf's restricted
# /diag end-to-end (ExecuteCommand from a resource is ACE-checked against
# the resource principal, not console). Harmless in production — the
# resource is inert without the convar.
ensure palm6_devtest
add_ace resource.palm6_devtest command.diag allow

