# palm6_eventguard: per-event ratelimits. Its position HERE, above every guarded
# resource, is the only thing that makes those budgets real. FiveM appends event
# handlers in registration order and CancelEvent() only stops handlers that have
# not run yet, so a guard registered after the owning resource can never drop
# anything.
#
# *** OPERATOR RULE: NEVER `restart palm6_eventguard` on a live box. ***
# A lone restart re-adds every guard at the END of every handler chain, silently
# turning all ~150 budgets into no-ops until the next FULL server restart. It
# looks fine (the boot banner still prints "guarding N events"), which is why the
# resource now also prints a red RESTARTED-after-consumers warning when it
# detects this. If you need a config change to take effect, restart the server.
ensure palm6_eventguard

